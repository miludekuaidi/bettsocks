# 放到你自己仓库的 .github/workflows/build-core.yml,main.go 放在仓库根目录。
# 在 Actions 页面手动运行,完成后 Releases 里会有 libmihomo.so.gz 和 sha256.txt。
name: build-mihomo-core
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clone mihomo
        run: git clone --depth 1 --branch Alpha https://github.com/MetaCubeX/mihomo.git mihomo
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: Build libmihomo.so (android/arm64)
        run: |
          mkdir -p mihomo/libcore
          cp main.go mihomo/libcore/main.go
          go version
          cd mihomo
          export CC="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          CGO_ENABLED=1 GOOS=android GOARCH=arm64 go build \
            -buildmode=c-shared -trimpath -tags with_gvisor \
            -ldflags "-s -w -checklinkname=0 -extldflags=-Wl,-z,max-page-size=16384" \
            -o ../libmihomo.so ./libcore
          cd ..
          sha256sum libmihomo.so | cut -d' ' -f1 | tee sha256.txt
          gzip -9 -k libmihomo.so
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "core-${{ github.run_number }}" libmihomo.so.gz sha256.txt --notes "mihomo core for android/arm64"
